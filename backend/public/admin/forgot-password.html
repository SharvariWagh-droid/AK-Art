<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Forgot Password — Abhilasha's Portfolio</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div><img src="/frontend/Personal work/logo.gif" alt=""></div>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your admin email to receive a reset token</p>
      
      <form id="adminForgotPasswordForm">
        <div class="form-group">
          <label for="forgotEmail">Admin Email</label>
          <input type="email" id="forgotEmail" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-login">Get Reset Token</button>
        
        <p style="text-align: center; margin-top: 15px;">
          <a href="admin-login.html" style="color: #ed871a; text-decoration: none; font-size: 14px;">Back to Login</a>
        </p>
      </form>
    </div>
  </div>
  <script src="admin.js"></script>
  <div id="toastContainer"></div>
</body>
</html>
