<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Reset Password — Abhilasha's Portfolio</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div><img src="/frontend/Personal work/logo.gif" alt=""></div>
      <h1>Reset Password</h1>
      <p class="subtitle">Secure your admin account with a new password</p>
      
      <form id="adminResetPasswordForm">
        <div class="form-group">
          <label for="resetPassword">New Password</label>
          <input type="password" id="resetPassword" placeholder="Enter new password" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-login">Update Password</button>
      </form>
    </div>
  </div>
  <script src="admin.js"></script>
  <div id="toastContainer"></div>
</body>
</html>
