<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | AK</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore Art</a></li>
            <li><a href="shop.html">Buy Prints</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
        <div class="user-profile">
            <i class="fas fa-user-circle" id="profileIcon"></i>
        </div>
    </nav>
</header>

<!-- ================= ABOUT SECTION ================= -->
<section class="about-container">

    <!-- IMAGE -->
    <div class="artist-image">
        <img id="aboutImage" src="" alt="Artist Image">
    </div>

    <!-- TEXT -->
    <div class="about-artist">

        <h2 class="section-heading">Meet The Artist</h2>
        <h1 id="aboutName" class="about-name"></h1>

        <p id="aboutBio" class="about-bio"></p>

        <h2 class="section-heading">Published Works:</h2>
        <ul id="publishedWorksList" class="about-works"></ul>

        <h2 class="section-heading" style="margin-top:20px;">Artist’s Worked With:</h2>
        <ul id="agenciesList" class="agencies-list"></ul>

    </div>

</section>

<!-- ================= TESTIMONIALS ================= -->
<section class="testimonials">
    <h2>What Authors Say</h2>
    <div id="testimonial-grid" class="testimonial-grid"></div>
</section>

<div class="profile-panel" id="profilePanel">
    <div class="avatar" id="profileAvatar"></div>
    <h3 id="profileGreeting"></h3>
    <p id="totalPrints"></p>
    <ul id="profilePrints"></ul>
    <button class="logout-btn" onclick="logoutUser()">Logout</button>
</div>

<!-- ================= FOOTER ================= -->
<div id="footer"></div>

<script src="script.js"></script>

</body>
</html>
