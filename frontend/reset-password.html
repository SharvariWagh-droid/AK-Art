<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AK Art</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div id="header"></div>

    <section class="login-section">

        <div class="login-card">

            <h2>Reset Password</h2>
            <p>Enter your new password below</p>

            <form id="resetPasswordForm">
                <div style="position: relative; margin-bottom: 15px; display: flex; align-items: center;">
                    <input type="password" id="newPassword" placeholder="New Password" required
                        style="width: 100%; padding-right: 40px; box-sizing: border-box; margin: 0;">
                    <i class="far fa-eye" onclick="togglePasswordVisibility('newPassword', this)"
                        style="position: absolute; right: 15px; font-size: 18px; color: #666; cursor: pointer; user-select: none;"></i>
                </div>
                
                <div style="position: relative; margin-bottom: 15px; display: flex; align-items: center;">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required
                        style="width: 100%; padding-right: 40px; box-sizing: border-box; margin: 0;">
                    <i class="far fa-eye" onclick="togglePasswordVisibility('confirmPassword', this)"
                        style="position: absolute; right: 15px; font-size: 18px; color: #666; cursor: pointer; user-select: none;"></i>
                </div>

                <button type="submit">Reset Password</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="register-text">
                Back to 
                <a href="login.html">Login</a>
            </p>

        </div>
    </section>

    <div id="footer"></div>

    <script src="./script.js"></script>
    <script>
        document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const password = document.getElementById("newPassword").value;
            const confirm = document.getElementById("confirmPassword").value;
            
            if (password !== confirm) {
                alert("Passwords do not match!");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                alert("Invalid or missing token.");
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Server Error:", errorText);
                    alert("Error: " + response.status + " " + response.statusText);
                    return;
                }

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    alert(data.message);
                    if (data.message.toLowerCase().includes("successful")) {
                        window.location.href = "login.html";
                    }
                } else {
                    const text = await response.text();
                    console.error("Non-JSON response:", text);
                    alert("Password reset failed. Please check if the backend is running on port 5000.");
                }

            } catch (err) {
                console.error("Fetch error:", err);
                alert("Could not connect to the server. Please ensure the backend is running on port 5000.");
            }
        });

        function togglePasswordVisibility(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>
</body>

</html>
