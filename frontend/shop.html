<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Prints | AK Art</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <!-- HEADER -->
    <header class="header">

        <div class="logo-container">
            <img src="Personal work/logo.gif" alt="Abhilasha Khatri Logo" class="logo">
        </div>

        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore Art</a></li>
                <li><a href="shop.html">Digital Prints</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="user-profile">
                <i class="fas fa-user-circle" id="profileIcon"></i>
            </div>
        </nav>

    </header>
    <div id="shopHeaderContainer" style="text-align: center; padding: 40px 10%; background: #fff;">
        <h1 id="dpTitle">Digital Prints</h1>
        <p id="dpDesc">A curated collection of premium illustrations for your modern space.</p>
    </div>


    <section class="prints-grid"></section>

    <div class="pagination">

        <button>‹</button>

        <button onclick="changePage(1)">1</button>
        <button onclick="changePage(2)">2</button>
        <button onclick="changePage(3)">3</button>

    </div>
    <div id="imageModal" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.85);
        justify-content:center;
        align-items:center;
        z-index:9999;
    ">
    
        <div id="modalContainer" style="
            display:flex;
            background:#fff;
            border-radius:12px;
            max-width:900px;
            width:90%;
            overflow:hidden;
            position: relative;
        ">
    
            <img id="modalImage" style="
                width:100%;
                max-height:80vh;
                object-fit:contain;
            " />
    
            <div id="modalDetails" style="
                padding:20px;
                width:50%;
            "></div>
    
            <!-- CLOSE BUTTON -->
            <span onclick="closeModal()" style="
                position: absolute;
                top: 10px;
                right: 15px;
                font-size: 28px;
                font-weight: bold;
                color: #333;
                cursor: pointer;
                z-index: 10;
            ">&times;</span>
    
        </div>
    
        <button id="modalBuyBtn" style="
            display:none;
            position:absolute;
            bottom:30px;
            background:#3b5bdb;
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:30px;
            font-size:16px;
            cursor:pointer;
        ">
            Buy Print
        </button>
    
    </div>

    <div class="profile-panel" id="profilePanel">
        <div class="avatar" id="profileAvatar"></div>
        <h3 id="profileGreeting"></h3>
        <p id="totalPrints"></p>
        <ul id="profilePrints"></ul>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
    <div id="footer"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="./script.js"></script>
</body>

</html>
