<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Prints | AK Art</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>

<body>
    <!-- HEADER -->
    <div id="header"></div>
    <div id="shopHeaderContainer" class="shop-header-container">
        <h1 id="dpTitle">Digital Prints</h1>
        <p id="dpDesc">A curated collection of premium illustrations for your modern space.</p>
    </div>


    <section class="prints-grid"></section>

    <div class="pagination">

        <button>‹</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>

    </div>
    <div id="imageModal" class="modal-overlay">
        <div id="modalContainer" class="modal-container">
            <img id="modalImage" class="modal-image-styled" />
            <div id="modalDetails" class="modal-details-styled"></div>
            <!-- CLOSE BUTTON -->
            <span class="modal-close-btn">&times;</span>
        </div>
        <button id="modalBuyBtn" class="modal-buy-btn-fixed">Buy Print</button>
    </div>

    <div class="profile-panel" id="profilePanel">
        <div class="avatar" id="profileAvatar"></div>
        <h3 id="profileGreeting"></h3>
        <p id="totalPrints"></p>
        <ul id="profilePrints"></ul>
        <button class="logout-btn">Logout</button>
    </div>
    <div id="footer"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="./script.js"></script>
</body>

</html>
