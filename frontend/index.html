<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhilasha Khatri | Portfolio </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500;700&family=Montserrat:wght@300;400;500;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="./Personal work/logo.gif">
</head>

<body>
    <div id="header"></div>
    <section class="hero">
        <div class="hero-content">
            <h1 id="heroTitle"></h1>
            <p id="heroSubtitle"></p>
            <div class="hero-buttons">
                <a href="explore.html" class="btn-primary">View Portfolio</a>
                <a href="shop.html" class="btn-secondary">Buy Digital Prints</a>
            </div>
        </div>

        <div class="hero-image">
            <div id="heroSlider" class="hero-slider"></div>
        </div>
    </section>

        <section class="personal-art">
            <div class="section-header">
                <h2>Personal Art</h2>
                <a href="gallery.html" class="view-all">View All →</a>
            </div>

            <div class="art-grid" id="home-art-grid">
            </div>
        </section>

        <section class=" personal-art storybook">
            <div class="section-header">
                <h2>Published Books</h2>
                <a href="Published Works.html" class="view-all">Explore Books →</a>
            </div>

            <div class="art-grid" id="home-book-grid">
            </div>
        </section>

    <div id="imageModal" class="modal-overlay">
        <div id="modalContainer" class="modal-container">
            <img id="modalImage" class="modal-image-styled" />
            <div id="modalDetails" class="modal-details-styled"></div>
            <!-- CLOSE BUTTON -->
            <span class="modal-close-btn">&times;</span>
        </div>
        <button id="modalBuyBtn" class="modal-buy-btn-fixed">Buy Print</button>
    </div>

        <div class="profile-panel" id="profilePanel">
            <div class="avatar" id="profileAvatar"></div>
            <h3 id="profileGreeting"></h3>
            <p id="totalPrints"></p>
            <ul id="profilePrints"></ul>
            <button class="logout-btn">Logout</button>
        </div>
    <div id="footer"></div>
        <script src="./script.js"></script>
</body>

</html>
