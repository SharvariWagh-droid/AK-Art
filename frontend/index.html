<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhilasha Khatri | Portfolio </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500;700&family=Montserrat:wght@300;400;500;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <header class="header">
        <div class="logo-container">
            <img src="Personal work/logo.gif" alt="Abhilasha Khatri Logo" class="logo">
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore Art</a></li>
                <li><a href="shop.html">Buy Prints</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <div class="user-profile">
                <i class="fas fa-user-circle" id="profileIcon"></i>
            </div>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1 id="heroTitle"></h1>
            <p id="heroSubtitle"></p>
            <div class="hero-buttons">
                <a href="explore.html" class="btn-primary">View Portfolio</a>
                <a href="shop.html" class="btn-secondary">Buy Digital Prints</a>
            </div>
        </div>

        <div class="hero-image">
            <div id="heroSlider" class="hero-slider"></div>
        </div>
    </section>

        <section class="personal-art">
            <div class="section-header">
                <h2>Personal Art</h2>
                <a href="gallery.html" class="view-all">View All →</a>
            </div>

            <div class="art-grid" id="home-art-grid">
            </div>
        </section>

        <section class=" personal-art storybook">
            <div class="section-header">
                <h2>Published Books</h2>
                <a href="Published Works.html" class="view-all">Explore Books →</a>
            </div>

            <div class="art-grid" id="home-book-grid">
            </div>
        </section>

        <div class="image-modal" id="imageModal">
            <span class="close" onclick="closeModal()">×</span>
            <button class="prev" onclick="changeImage(-1)">❮</button>
            <img class="modal-content" id="modalImage">
            <button class="next" onclick="changeImage(1)">❯</button>
        </div>

        <div class="profile-panel" id="profilePanel">
            <div class="avatar" id="profileAvatar"></div>
            <h3 id="profileGreeting"></h3>
            <p id="totalPrints"></p>
            <ul id="profilePrints"></ul>
            <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </div>
    <div id="footer"></div>
        <script src="script.js"></script>
</body>

</html>
