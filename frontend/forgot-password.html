<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AK Art</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div id="header"></div>

    <section class="login-section">

        <div class="login-card">

            <h2>Forgot Password</h2>
            <p>Enter your email to receive a reset link</p>

            <form id="forgotPasswordForm">
                <input type="email" id="forgotEmail" placeholder="Email Address" required>
                <button type="submit">Send Reset Link</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="register-text">
                Remembered your password?
                <a href="login.html">Login here</a>
            </p>

        </div>
    </section>
    <div id="footer"></div>

    <script src="./script.js"></script>
    <script>
        document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("forgotEmail").value;
            const btn = e.target.querySelector("button");
            
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const response = await fetch("http://localhost:5000/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Server Error:", errorText);
                    alert("Error: " + response.status + " " + response.statusText);
                    return;
                }

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    alert(data.message);
                } else {
                    const text = await response.text();
                    console.error("Non-JSON response:", text);
                    alert("Email not sent. Please check if the backend is running on port 5000.");
                }

            } catch (err) {
                console.error("Fetch error:", err);
                alert("Could not connect to the server. Please ensure the backend is running on port 5000.");
            } finally {
                btn.innerText = "Send Reset Link";
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
