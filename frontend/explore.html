<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Art & Works</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="header"></div>
    <section class="explore-hero">
        <h1>Explore Art & Works</h1>
        <p>
            A curated portfolio of whimsical illustrations, published books,
            and museum-quality digital prints.
        </p>
    </section>
    <section id="explore-menu" class="explore-nav">
        <ul>
            <li><a href="#personal-art">Personal Art</a></li>
            <li><a href="#published-works">Published Works</a></li>
            <li><a href="#digital-prints">Digital Prints</a></li>
        </ul>
    </section>
    <section id="personal-art" class="explore-section">
        <h2>Personal Art</h2>
        <div class="explore-grid" id="explore-art-grid">
        </div>

        <a href="gallery.html" class="view-more">View More</a>
    </section>
    <section id="published-works" class="explore-section">
        <h2>Published Works</h2>
        <div class="explore-grid" id="explore-book-grid">
        </div>
        <a href="Published Works.html" class="view-more">View More</a>
    </section>
    <section id="digital-prints" class="explore-section">
        <h2>Digital Prints</h2>
        <div class="explore-grid" id="explore-print-grid">
        </div>
        <a href="shop.html" class="view-more">View More</a>
    </section>
    <div id="imageModal" class="modal-overlay">
        <div id="modalContainer" class="modal-container">
            <img id="modalImage" class="modal-image-styled" />
            <div id="modalDetails" class="modal-details-styled"></div>
            <!-- CLOSE BUTTON -->
            <span class="modal-close-btn">&times;</span>
        </div>
        <button id="modalBuyBtn" class="modal-buy-btn-fixed">Buy Print</button>
    </div>

    <div id="footer"></div>
    <script src="./script.js"></script>
</body>
</html>
