<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Artwork</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadGalleryFromDB()">
    <section class="gallery-page">
        <h2>All Personal Artwork</h2>
        <div class="art-grid" id="gallery-grid">
        </div>
    </section>

    <div id="imageModal" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.85);
        justify-content:center;
        align-items:center;
        z-index:9999;
    ">

        <div id="modalContainer" style="
            display:flex;
            background:#fff;
            border-radius:12px;
            max-width:900px;
            width:90%;
            overflow:hidden;
            position: relative;
        ">

            <img id="modalImage" style="
                width:100%;
                max-height:80vh;
                object-fit:contain;
            " />

            <div id="modalDetails" style="
                padding:20px;
                width:50%;
            "></div>

            <!-- CLOSE BUTTON -->
            <span onclick="closeModal()" style="
                position: absolute;
                top: 10px;
                right: 15px;
                font-size: 28px;
                font-weight: bold;
                color: #333;
                cursor: pointer;
                z-index: 10;
            ">&times;</span>

        </div>

        <button id="modalBuyBtn" style="
            display:none;
            position:absolute;
            bottom:30px;
            background:#3b5bdb;
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:30px;
            font-size:16px;
            cursor:pointer;
        ">
            Buy Print
        </button>

    </div>

    <div id="footer"></div>
    <script src="./script.js"></script>
</body>

</html>
