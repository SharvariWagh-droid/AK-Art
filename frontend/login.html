<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AK Art</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div id="header"></div>


    <section class="login-section">

        <div class="login-card">

            <h2>Welcome Back</h2>
            <p>Login to continue exploring artwork</p>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>

                <div style="position: relative; margin-bottom: 15px; display: flex; align-items: center;">
                    <input type="password" id="loginPassword" placeholder="Password" required
                        style="width: 100%; padding-right: 40px; box-sizing: border-box; margin: 0;">
                    <i class="far fa-eye" onclick="togglePasswordVisibility('loginPassword', this)"
                        style="position: absolute; right: 15px; font-size: 18px; color: #666; cursor: pointer; user-select: none;"></i>
                </div>
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="forgot-password.html" style="font-size: 14px; color: #2d5bff; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </div>
    </section>
    <div id="footer"></div>

    <script src="./script.js"></script>
</body>

</html>
