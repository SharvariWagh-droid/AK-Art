<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Published Work</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./Personal work/logo.gif">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="header"></div>

    <section class="gallery-page">

        <h2>Published Work</h2>

     <div class="art-grid" id="published-grid"></div>
    </section>


    <div id="imageModal" class="modal-overlay">
        <div id="modalContainer" class="modal-container">
            <img id="modalImage" class="modal-image-styled" />

            <!-- CLOSE BUTTON -->
            <span class="modal-close-btn">&times;</span>
        </div>
        <button id="modalBuyBtn" class="modal-buy-btn-fixed">Buy Print</button>
    </div>

    <div id="footer"></div>
    <script src="./script.js"></script>
