<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful | AK Art</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="./Personal work/logo.gif">
</head>

<body>

    <!-- HEADER -->

    <div id="header"></div>


    <!-- SUCCESS SECTION -->

    <section class="success-section">

        <div class="success-container">

            <div class="success-icon">✔</div>

            <h1>Payment Successful</h1>

            <p class="success-message" id="paymentStatus">
                Thank you for purchasing from AK Art. Your digital artwork is ready to download.
            </p>
            <p id="verificationStatus" style="font-weight: 600; margin-top: 10px;"></p>


            <div class="order-details">

                <img id="artPreview" alt="Purchased Artwork">

                <h3 id="artName"></h3>

                <p id="artPrice"></p>
                <div class="size-section">
                    <p>Select Size:</p>

                    <div class="size-options">
                        <button class="size-btn active" data-size="6x7">6 x 7</button>
                        <button class="size-btn" data-size="8x12">8 x 12</button>
                    </div>

                    <p>Select Format:</p>

                    <div class="format-options">
                        <button class="format-btn active" data-format="jpg">JPG</button>
                        <button class="format-btn" data-format="png">PNG</button>
                    </div>
                </div>

            </div>


            <div class="success-buttons">

                <button class="download-btn" onclick="downloadArt()">
                    Download Artwork
                </button>

                <a href="shop.html">
                    <button class="shop-btn">
                        Continue Shopping
                    </button>
                </a>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <div id="footer"></div>
    <script src="./script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            const params = new URLSearchParams(window.location.search);

            const paymentId = params.get("razorpay_payment_id");
            const orderId = params.get("razorpay_order_id");
            const signature = params.get("razorpay_signature");

            console.log("Payment ID:", paymentId);
            console.log("Order ID:", orderId);
            console.log("Signature:", signature);

            const statusEl = document.getElementById("verificationStatus");

            // ❌ Invalid session
            if (!paymentId || !orderId || !signature) {
                if (statusEl) {
                    statusEl.innerHTML = "<span style='color:#e74c3c;'>Invalid payment session!</span>";
                }
                return;
            }

            try {
                // ✅ VERIFY PAYMENT 
                const response = await fetch("http://localhost:5000/api/payment/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        razorpay_order_id: orderId,
                        razorpay_payment_id: paymentId,
                        razorpay_signature: signature
                    })
                });

                const data = await response.json();

                if (data.success) {

                    if (statusEl) {
                        statusEl.innerHTML = "<span style='color:#27ae60;'>✔ Payment Verified</span>";
                    }

                    // ✅ FETCH ORDER DETAILS (FIXED)
                    try {
                        const orderRes = await fetch("http://localhost:5000/api/orders/payment/" + paymentId);
                        const result = await orderRes.json();

                        if (result) {

                            const order = result;

                            const artPreview = document.getElementById("artPreview");
                            const artName = document.getElementById("artName");
                            const artPrice = document.getElementById("artPrice");

                            const fullImageUrl = "http://localhost:5000/uploads/" + order.image;

                            if (artPreview) artPreview.src = fullImageUrl;
                            if (artName) artName.innerText = order.artName;
                            if (artPrice) artPrice.innerText = "₹" + order.price;

                            localStorage.setItem("artImage", fullImageUrl);
                            localStorage.setItem("artName", order.artName);
                            localStorage.setItem("artPrice", order.price);

                        } else {
                            alert("No artwork found!");
                        }
                    } catch (orderErr) {
                        console.error("Error loading order details:", orderErr);
                    }

                } else {
                    if (statusEl) {
                        statusEl.innerHTML = "<span style='color:#e74c3c;'>✖ Verification Failed</span>";
                    }
                    alert("Payment verification failed!");
                }

            } catch (err) {
                console.error("Verification error:", err);
                if (statusEl) {
                    statusEl.innerHTML = "<span style='color:#e74c3c;'>Error verifying payment.</span>";
                }
            }

        });
    </script>
</body>

</html>
