<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Homepage — Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="../frontend/style.css">
</head>
<body onload="checkAuth(); loadHomepageCMS();">
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">A</div>
        <div>
          <h2>Abhilasha</h2>
          <small>Admin Panel</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="manage-art.html"><span class="nav-icon">🎨</span> Personal Art</a>
        <a href="published-works.html"><span class="nav-icon">📚</span> Published Works</a>
        <a href="digital-prints.html"><span class="nav-icon">🖼️</span> Digital Prints</a>
        <a href="orders.html"><span class="nav-icon">📦</span> Orders</a>
        <a href="testimonials.html"><span class="nav-icon">💬</span> Testimonials</a>
        <a href="edit-homepage.html" class="active"><span class="nav-icon">🏠</span> Edit Homepage</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" onclick="logout()">🚪 Sign Out</a>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <header class="top-header">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <h1>Edit Homepage</h1>
        </div>
        <div class="header-right">
          <div class="admin-profile">
            <div class="admin-avatar">A</div>
            <span class="admin-name">Abhilasha</span>
          </div>
        </div>
      </header>

      <div class="content-area">
        <div class="section-header">
          <h2>Hero Section Content</h2>
        </div>

        <div class="table-wrapper" style="padding: 30px;">
          <form onsubmit="saveHomepageCMS(event)">
            <div class="form-group">
              <label>Hero Title</label>
              <input type="text" id="hero-title" placeholder="Enter hero title" required>
            </div>

            <div class="form-group">
              <label>Hero Subtitle</label>
              <textarea id="hero-subtitle" placeholder="Enter hero subtitle" required></textarea>
            </div>

            <div class="form-group">
              <label>Hero Slider Images (5 slots)</label>
              <div id="heroUploadGrid" class="hero-upload-grid"></div>
            </div>

            <div class="form-group" style="margin-top: 30px;">
              <label>Color Settings</label>
              <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                  <input type="radio" name="palette" value="pastel"> Soft Pastel
                </label>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                  <input type="radio" name="palette" value="earth"> Warm Earth
                </label>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                  <input type="radio" name="palette" value="dark"> Elegant Dark
                </label>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                  <input type="radio" name="palette" value="playful"> Playful Kids
                </label>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                  <input type="radio" name="palette" value="custom" checked> Custom
                </label>
              </div>

              <!-- Custom Colors (Visible only when 'custom' is selected) -->
              <div id="customColorSelectors" style="display: flex; gap: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Title Color</label>
                  <input type="color" id="heroTitleColor" value="#1a1a1a">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Subtitle Color</label>
                  <input type="color" id="heroSubtitleColor" value="#555555">
                </div>
              </div>

              <!-- Text Styling -->
              <div id="customTextStyling" style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Title Font Size</label>
                  <input type="text" id="heroTitleSize" placeholder="e.g. 48px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Subtitle Font Size</label>
                  <input type="text" id="heroSubtitleSize" placeholder="e.g. 16px">
                </div>
                   </div>
            </div>
 
            <!-- Portfolio (Explore Page) Section -->
            <div class="form-group" style="margin-top:40px; border-top:1px solid #eee; padding-top:30px;">
              <label style="font-size:1.1rem; font-weight:600; margin-bottom: 20px; display: block;">🎨 Portfolio (Explore Page)</label>

              <div class="form-group">
                <label>Portfolio Title</label>
                <input type="text" id="portfolioTitle" placeholder="Enter portfolio title">
              </div>

              <div class="form-group">
                <label>Portfolio Subtitle</label>
                <textarea id="portfolioSubtitle" placeholder="Enter portfolio subtitle"></textarea>
              </div>

              <div class="form-group" style="margin-top:20px;">
                <label>Color Settings</label>
                <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom: 15px;">
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="portfolioPalette" value="pastel"> Soft Pastel
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="portfolioPalette" value="earth"> Warm Earth
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="portfolioPalette" value="dark"> Elegant Dark
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="portfolioPalette" value="playful"> Playful Kids
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="portfolioPalette" value="custom" checked> Custom
                  </label>
                </div>

                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Title Color</label>
                    <input type="color" id="portfolioTitleColor">
                  </div>
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Subtitle Color</label>
                    <input type="color" id="portfolioSubtitleColor">
                  </div>
                </div>

                <div style="display:flex; gap:20px; flex-wrap:wrap; margin-top:20px;">
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Title Size</label>
                    <input type="text" id="portfolioTitleSize" placeholder="e.g. 48px">
                  </div>
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Subtitle Size</label>
                    <input type="text" id="portfolioSubtitleSize" placeholder="e.g. 16px">
                  </div>
                </div>
              </div>
            </div>

            <!-- Digital Prints Section -->
            <div class="form-group" style="margin-top: 40px; border-top: 1px solid #eee; padding-top: 30px;">
              <label style="font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; display: block;">🖼️ Digital Prints Section</label>
              
              <div class="form-group">
                <label>Section Title</label>
                <input type="text" id="digitalPrintTitle" placeholder="Enter prints title">
              </div>

              <div class="form-group">
                <label>Section Description</label>
                <textarea id="digitalPrintDescription" placeholder="Enter prints description"></textarea>
              </div>

              <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Title Font Size</label>
                  <input type="text" id="digitalPrintTitleSize" placeholder="e.g. 32px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Description Font Size</label>
                  <input type="text" id="digitalPrintDescSize" placeholder="e.g. 16px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Text Color</label>
                  <input type="color" id="digitalPrintTextColor" value="#000000">
                </div>
              </div>

              <div class="form-group" style="margin-top:20px;">
                <label>Color Settings</label>
                <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom: 15px;">
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="digitalPalette" value="pastel"> Soft Pastel
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="digitalPalette" value="earth"> Warm Earth
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="digitalPalette" value="dark"> Elegant Dark
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="digitalPalette" value="playful"> Playful Kids
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="digitalPalette" value="custom" checked> Custom
                  </label>
                </div>

                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Title Color</label>
                    <input type="color" id="digitalPrintTitleColor" value="#000000">
                  </div>
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Description Color</label>
                    <input type="color" id="digitalPrintDescColor" value="#555555">
                  </div>
                </div>
              </div>
            </div>

            <!-- Footer Section -->
            <div class="form-group" style="margin-top: 40px; border-top: 1px solid #eee; padding-top: 30px;">
              <label style="font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; display: block;">✨ Footer Section Content</label>
              
              <div class="form-group">
                <label>Footer Title</label>
                <input type="text" id="footerTitle" placeholder="Enter footer title">
              </div>
 
              <div class="form-group">
                <label>Footer Description</label>
                <textarea id="footerDescription" placeholder="Enter footer description"></textarea>
              </div>
 
              <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Footer Text Color</label>
                  <input type="color" id="footerTextColor" value="#333333">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                  <label style="font-size: 13px;">Footer Font Size</label>
                  <input type="text" id="footerFontSize" placeholder="e.g. 16px">
                </div>
              </div>

              <div class="form-group" style="margin-top:20px;">
                <label>Color Settings</label>
                <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom: 15px;">
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="footerPalette" value="pastel"> Soft Pastel
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="footerPalette" value="earth"> Warm Earth
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="footerPalette" value="dark"> Elegant Dark
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="footerPalette" value="playful"> Playful Kids
                  </label>
                  <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="footerPalette" value="custom" checked> Custom
                  </label>
                </div>

                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Title Color</label>
                    <input type="color" id="footerTitleColor" value="#333333">
                  </div>
                  <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:13px;">Description Color</label>
                    <input type="color" id="footerDescColor" value="#555555">
                  </div>
                </div>
              </div>
            </div>

            <div class="modal-actions" style="justify-content: flex-start; margin-top: 40px;">
              <button type="submit" class="btn btn-primary" style="padding: 12px 40px;">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="../frontend/script.js"></script>
  <script src="admin.js"></script>
<div id="toastContainer"></div></body>
</html>
