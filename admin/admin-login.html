<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Abhilasha's Portfolio</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
     <div><img src="/frontend/Personal work/logo.gif" alt=""></div>
      <h1>Welcome Abhilasha</h1>
      <p class="subtitle">Manage your creative world</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="password" placeholder="Enter password" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
            <i class="far fa-eye" onclick="togglePasswordVisibility()" id="togglePasswordIcon" style="position: absolute; right: 15px; font-size: 18px; color: #666; cursor: pointer; user-select: none;" title="Toggle Password Visibility"></i>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
      </form>
    </div>
  </div>
  <script src="../frontend/script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
